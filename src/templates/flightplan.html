<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; font-size: 9pt; color: #111; }
  h1 { font-size: 15pt; margin-bottom: 10pt; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #666; padding: 4pt; text-align: left; }
  th { background-color: #e5e5e5; }
</style>
</head>
<body>
  <h1>{{title}}</h1>
  <table>
    <thead>
      <tr>
        <th>Waypoint</th>
        <th>Course</th>
        <th>Distance</th>
        <th>ETE</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</body>
</html>
