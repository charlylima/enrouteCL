name: Compile on iOS

on:
  push:
    branches: [ develop ]
    paths-ignore: &paths-ignore
      - ".gitignore"
      - "README.md"
      - "fastlane/metadata/**"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/api.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the builds of an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-latest
    
    steps:
    - name: Checkout Enroute
      uses: actions/checkout@v7
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Read Qt version
      run: echo "QT_VERSION=$(cat enroute/.github/qt-version)" >> "$GITHUB_ENV"
    - name: Install Ninja
      run: brew install ninja
    - name: Install Qt for Desktop
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        cache-key-prefix: 'install-qt-action-macOS-host'
        version: ${{ env.QT_VERSION }}
        modules: 'qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtshadertools qtspeech qtwebsockets qtwebview'
    - name: Set QT_HOST_PATH
      run: |
        echo QT_HOST_PATH=$QT_ROOT_DIR >> $GITHUB_ENV
    - name: Install Qt for iOS
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        cache-key-prefix: 'install-qt-action-iOS'
        target: 'ios'
        version: ${{ env.QT_VERSION }}
        modules: 'qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtshadertools qtsensors qtspeech qtwebsockets qtwebview'
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ios
    - name: Compile Enroute Flight Navigation
      run: |
        $QT_ROOT_DIR/bin/qt-cmake \
          -B build-enroute \
          -S enroute \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_INSTALL_PREFIX=.
        cmake --build build-enroute -- -sdk iphonesimulator
