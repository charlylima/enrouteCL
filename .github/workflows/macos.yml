name: Compile on MacOS

on:
  # TEMPORARY: build on every branch while the in-tree dependency integration
  # is tested from feature branches. Revert to 'branches: [ develop ]' afterwards.
  push:
    branches: ['**']
    paths-ignore: &paths-ignore
      - ".gitignore"
      - "README.md"
      - "fastlane/metadata/**"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: write  # gh release upload to developerBuilds

# A newer push supersedes the builds of an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-latest
    
    steps:
    - name: Checkout Enroute
      uses: actions/checkout@v7
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Read Qt version
      run: echo "QT_VERSION=$(cat enroute/.github/qt-version)" >> "$GITHUB_ENV"
    - name: Install Ninja
      run: brew install ninja
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        modules: 'qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtserialport qtshadertools qtspeech qtwebsockets qtwebview'
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: macos
    - name: Compile Enroute Flight Navigation
      run: |
        cmake \
          -B build-enroute \
          -S enroute \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_INSTALL_PREFIX=. \
          -DQTDEPLOY=ON 
        cmake --build build-enroute
    - name: Package
      run: |
        cmake --build build-enroute --target install
        /usr/bin/sudo $QT_ROOT_DIR/bin/macdeployqt enroute.app -dmg
        mv enroute.dmg enroute-macOS-universal.dmg
